services:
  postgres:
    image: postgres:17
    container_name: hackathon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: hackathon_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
